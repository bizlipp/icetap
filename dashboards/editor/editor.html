<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICETAP - Call Editor</title>
  <link rel="stylesheet" href="../../js/style.css">
  <link rel="stylesheet" href="editor.css">
  <script src="https://kit.fontawesome.com/your-fontawesome-kit.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="dashboard-container" id="editorDashboard">
    <header class="dashboard-header">
      <h1><i class="fas fa-edit mr-2"></i>Call Editor</h1>
      <div id="editorFilenameDisplay" class="filename-display">No file loaded</div>
    </header>

    <section class="dashboard-section navigation-controls card">
      <h2 class="section-title"><i class="fas fa-compass mr-2"></i>Navigation</h2>
      <div class="button-group">
        <button id="prevCallButton" class="button"><i class="fas fa-arrow-left mr-2"></i>Previous Call</button>
        <button id="nextCallButton" class="button"><i class="fas fa-arrow-right mr-2"></i>Next Call</button>
      </div>
      <div class="jump-to-contact-id mt-3">
        <input type="text" id="jumpToContactIdInput" placeholder="Enter Contact ID to jump..." class="editor-field p-2 border rounded" style="width: 250px; margin-right: 5px;" />
        <button id="jumpToContactIdButton" class="button"><i class="fas fa-search mr-1"></i>Jump</button>
      </div>
      <div id="editorStatus" class="status-message mt-2">Loading call data...</div>
    </section>

    <section class="dashboard-section editor-main-content card mt-4">
      <!-- This section will be populated by editor.js -->
      <!-- It used to contain editor-fields-section, but now it will hold the dynamically generated form -->
      <form id="callEditorForm">
        <!-- Content dynamically generated by editor.js -->
      </form>
      <div class="form-actions mt-4" style="padding: 1rem;">
        <button id="saveCallButton" class="button primary"><i class="fas fa-save mr-2"></i>Save Changes</button>
      </div>
    </section>

    <!-- This is the old static form structure - it will be removed as editor.js dynamically builds the form -->
    <!-- <section class="dashboard-section editor-fields-section card mt-4">
// ... existing code ...
      </form>
      <div class="form-actions mt-4">
        <button id="saveCallButton" class="button primary"><i class="fas fa-save mr-2"></i>Save Changes</button>
      </div>
    </section> -->
  </div>

  <!-- Common ICETAP JS libraries -->
  <script src="../../js/config.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/schema.js"></script>
  <script src="../../js/transform.js"></script>
  <script src="../../js/index.js"></script>
  <script src="../../js/call-analysis.js"></script> <!-- Though not directly used for analysis, good for consistency and if pre-analyzed data structure is assumed -->

  <!-- Initialize DataStackULTRA for standalone use -->
  <script>
    (async () => {
  try {
    if (!window.DataStackULTRA) {
      window.DataStackULTRA = new AppStorageManager({ encryptionEnabled: false });
      console.log(`DataStackULTRA initialized for ${document.title} (encryption disabled).`);
    } else {
      console.log(`DataStackULTRA already exists for ${document.title}.`);
    }

    const existingCalls = await window.DataStackULTRA.get('loadedCalls');
    if (Array.isArray(existingCalls) && existingCalls.length > 0) {
      console.log(`✅ ${existingCalls.length} calls loaded from DataStackULTRA memory for ${document.title}.`);
    } else {
      console.warn(`⚠️ No calls found in 'loadedCalls'. Dashboard may be empty until a file is loaded.`);
    }

  } catch (e) {
    console.error(`❌ Failed to initialize/load DataStackULTRA in ${document.title}:`, e);
    const mainDashboardArea = document.getElementById('analyticsDashboard'); 
    if(mainDashboardArea) {
      mainDashboardArea.innerHTML = `
        <p class="no-data-message card p-4 text-center">
          <i class="fas fa-exclamation-triangle mr-2"></i>
          FATAL: DataStackULTRA could not be initialized/loaded. Dashboard cannot load.
        </p>`;
    }
  }
})();

  </script>
  
  <script src="../../js/audit-merge.js"></script> <!-- If editor interacts with master log or similar -->
  <script src="editor.js"></script>
</body>
</html>
